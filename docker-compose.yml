# motorhof-bot: один сервис bot. Запуск и обновление: git pull && docker compose up -d --build
# (переход со старого имени сервиса photos — README, «Обновление до версии с меню»)
# Секреты здесь не пишем: они в .env (env_file) и в rclone/rclone.conf (volume).
services:
  bot:
    build: .
    image: motorhof-bot:latest
    container_name: motorhof-bot
    restart: unless-stopped          # поднимается после перезагрузки (нужен systemctl enable docker)
    env_file: .env
    volumes:
      # SQLite (очередь, журнал) и временные файлы; пути TMP_DIR и DB_PATH из .env лежат здесь
      - ./data:/app/data
      # каталог с rclone.conf на запись (RCLONE_CONFIG задан в Dockerfile): rclone сохраняет обновлённый OAuth-токен
      # переименованием файла, а смонтированный отдельно файл переименовать нельзя
      - ./rclone:/config/rclone
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
